version: '3.8'

services:
  kanban:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/kanban
      - REDIS_URL=redis://redis:6379
      - OPENSIGN_URL=http://opensign:3001
      - OPENSIGN_API_TOKEN=${OPENSIGN_API_TOKEN}
      - OPENSIGN_WEBHOOK_SECRET=${OPENSIGN_WEBHOOK_SECRET}
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: npm run dev

  opensign:
    image: opensignlabs/opensign:latest
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/opensign
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${OPENSIGN_JWT_SECRET:-opensign-dev-secret}
      - ADMIN_EMAIL=dev@kanban.local
      - ADMIN_PASSWORD=dev123456
      - WEBHOOK_URL=http://kanban:3000/api/webhooks/opensign
      - TSA_URL=https://freetsa.org/tsr
    volumes:
      - ./Opensign:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_MULTIPLE_DATABASES=kanban,opensign
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
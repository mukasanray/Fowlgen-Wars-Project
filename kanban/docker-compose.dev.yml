version: '3.8'

services:
  kanban:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "${KANBAN_HOST_PORT:-3002}:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:[REDACTED]@postgres:5432/kanban
      - REDIS_URL=redis://redis:6379
      - OPENSIGN_URL=http://opensign:3001
      - OPENSIGN_API_TOKEN=${OPENSIGN_API_TOKEN:-}
      - OPENSIGN_WEBHOOK_SECRET=${OPENSIGN_WEBHOOK_SECRET:-}
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: npm run dev

  opensign-server:
    image: opensign/opensignserver:main
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env.opensign.local
    environment:
      - NODE_ENV=production
      - SERVER_URL=http://localhost:3001/api/app
      - PUBLIC_URL=http://localhost:3001
    volumes:
      - opensign_files:/usr/src/app/files
    depends_on:
      mongo:
        condition: service_started

  opensign:
    image: opensign/opensign:main
    ports:
      - "3003:3000"
    env_file:
      - .env.opensign.local
    depends_on:
      opensign-server:
        condition: service_started

  caddy:
    image: caddy:latest
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - HOST_URL=${HOST_URL:-localhost:3001}

  mongo:
    image: mongo:latest
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_MULTIPLE_DATABASES=kanban,${OPENSIGN_DB_NAME}
      - OPENSIGN_DB_USER=${OPENSIGN_DB_USER}
      - OPENSIGN_DB_PASSWORD=${OPENSIGN_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  mongo_data:
  opensign_files:
  caddy_data:
  caddy_config:

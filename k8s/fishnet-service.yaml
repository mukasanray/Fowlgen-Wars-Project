apiVersion: v1
kind: Service
metadata:
  name: fishnet-server-service
spec:
  type: ClusterIP
  selector:
    app: fishnet-server
  ports:
    - name: fishnet-udp
      protocol: UDP
      port: 7770
      targetPort: 7770
    - name: fishnet-tcp
      protocol: TCP
      port: 7770
      targetPort: 7770

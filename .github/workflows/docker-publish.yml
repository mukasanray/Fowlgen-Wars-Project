name: Docker Build and Publish to GHCR

on:
  push:
    branches: [ "main", "master" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main", "master" ]

env:
  REGISTRY: ghcr.io
  # Converts repository owner to lowercase for docker image naming rules
  IMAGE_NAME_API: ${{ github.repository_owner }}/fowlgenwars-api
  IMAGE_NAME_FISHNET: ${{ github.repository_owner }}/fowlgenwars-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase image names
        run: |
          echo "IMAGE_NAME_API=${IMAGE_NAME_API,,}" >>${GITHUB_ENV}
          echo "IMAGE_NAME_FISHNET=${IMAGE_NAME_FISHNET,,}" >>${GITHUB_ENV}

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for API
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}

      - name: Build and push API Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}

      - name: Extract metadata for FishNet
        id: meta-fishnet
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FISHNET }}

      - name: Build and push FishNet Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-fishnet.outputs.tags }}
          labels: ${{ steps.meta-fishnet.outputs.labels }}

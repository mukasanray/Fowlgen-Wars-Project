name: Anchor Smart Contract CI & Verification

on:
  push:
    paths:
      - "program/**"
      - ".github/workflows/anchor-ci.yml"
  pull_request:
    paths:
      - "program/**"
      - ".github/workflows/anchor-ci.yml"

jobs:
  anchor-test-and-verify:
    name: ⚡ Anchor LiteSVM Contract Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "program -> target"

      - name: Instalar Dependencias do Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libudev-dev protobuf-compiler

      - name: Instalar Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v2.1.14/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Instalar Anchor CLI
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --locked
          avm install 1.2.0
          avm use 1.2.0
          echo "$HOME/.avm/bin" >> $GITHUB_PATH

      - name: Build Smart Contract & Test LiteSVM
        run: |
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$HOME/.avm/bin:$PATH"
          cd program
          cargo fmt --check
          cargo clippy -- -D warnings || true
          anchor keys sync
          anchor build --arch v0
          cargo test --verbose

name: Sincronizar OpenSpec ↔ Kanban
on:
  schedule:
    - cron: '0 9 * * 1-5'  # Segunda a Sexta, 9h
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Setup Node.js (se necessário)
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Instalar dependências GitHub CLI (gh)
        run: |
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Autenticar com GitHub
        run: echo "GH_TOKEN=${{ secrets.GH_TOKEN }}" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Sincronizar OpenSpec ↔ Kanban
        run: |
          # Garantir execute permissions
          chmod +x ./fowlgowwars-kanban-sync.sh
          ./fowlgowwars-kanban-sync.sh
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Commit e push mudanças
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "📊 sync: OpenSpec → GitHub Kanban $(date +%Y-%m-%d)" || exit 0
          git push